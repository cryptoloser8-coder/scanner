# ─────────────────────────────────────────────────────────────
#  OI & TOTAL Monitor — konfiguracja
#  Po zmianie tego pliku (commit na main) kolejne uruchomienie
#  bota użyje nowych ustawień — nic więcej nie trzeba robić.
# ─────────────────────────────────────────────────────────────

coinalyze:
  # Giełdy, z których sumujemy open interest (perpetuale).
  # Nazwy porównywane z listą /exchanges w Coinalyze (bez rozróżniania wielkości liter).
  # (Bitget nie ma w Coinalyze. BitMEX jest, ale na razie nie trafia do listy rynków — do sprawdzenia.)
  exchanges: [Binance, Bybit, OKX, Hyperliquid, Deribit, BitMEX]
  # Ile największych (wg OI) coinów liczymy. 0 = wszystkie.
  # Ogon poza top 200 to zwykle ~1–2% całego OI, a mocno skraca czas pobierania
  # (limit API: 40 zapytań/min, każdy rynek = 1 zapytanie).
  max_assets: 200
  # Co ile godzin odświeżać listę rynków i ranking top coinów
  # (odświeżenie sprawdza OI wszystkich rynków — to najdłuższy krok, ~1h).
  universe_refresh_hours: 72
  # Od kiedy pobierać historię dzienną przy backfillu
  # (Coinalyze ma pełne dane mniej więcej od 09.2022 — wcześniejsze dni są obcinane).
  daily_history_start: "2019-01-01"

  # Tylko krypto: giełdy listują też perpy na złoto, ropę, akcje (XAU, CL, GOOGL…).
  # Liczymy tylko coiny z top N wg kapitalizacji na CoinGecko…
  crypto_whitelist_top: 1500
  # …i zawsze wykluczamy te (tokeny złota, indeksy, akcje, które mogłyby trafić na listę):
  exclude_assets: [XAU, XAG, XPT, XPD, XAUT, PAXG, KAU, KAG, CL, BZ, NG, WTI, BRENT, COPPER,
                   SPX, SPY, QQQ, NDX, NAS100, US30, US500, DJI, SOXL, TQQQ, SPCX,
                   AAPL, MSFT, GOOGL, GOOG, AMZN, META, TSLA, NVDA, AMD, INTC, NFLX, COIN,
                   MSTR, HOOD, PLTR, SNDK, SKHYNIX, SKHY, ORCL, AVGO, MU, TSM, BABA, CRCL,
                   EUR, JPY, GBP, USDC, USDT, FDUSD, USDE, EURC,
                   # perpy pre-IPO na prywatne spółki
                   ANTHROPIC, OPENAI, SPACEX, XAI, STRIPE, DATABRICKS, ANDURIL]
  # Wymuś uwzględnienie coina, którego nie ma na liście CoinGecko (np. świeży listing).
  include_assets: []

# Coiny, których OI ma być dostępne osobno na wykresach (oprócz BTC i ETH).
# Te same coiny mają osobne likwidacje i funding w zakładce Likwidacje.
watchlist: [SOL, XRP, BNB, DOGE, HYPE, SUI]

# ─────────────────────────────────────────────────────────────
#  LIKWIDACJE I FUNDING (zakładka liq.html)
#  Te same giełdy co OI. Likwidacje Coinalyze ma tylko z Binance, Bybit i OKX
#  (Hyperliquid i Deribit: brak), funding — ze wszystkich, także z Hyperliquid.
#  Każdy rynek = 1 zapytanie
#  na likwidacje + 1 na funding, więc liczymy tylko największe coiny.
#  Pierwsze uruchomienie po wgraniu samo pobierze historię (dłuższe o ~40 min).
# ─────────────────────────────────────────────────────────────
liquidations:
  enabled: true
  # BTC + ETH + tyle największych (wg OI) altów; watchlista jest dodawana zawsze.
  top_alts: 30
  # Pomijaj rynki z OI poniżej tej kwoty (USD) — prawie nie mają likwidacji, a kosztują zapytanie.
  min_market_oi_usd: 1.0e6
  # Co ile godzin giełda rozlicza funding (do przeliczenia na % rocznie). Hyperliquid co godzinę.
  funding_interval_hours: {default: 8, Hyperliquid: 1}
  # Jednostka fundingu w Coinalyze: auto | percent (0.01 = 0,01%) | fraction (0.0001 = 0,01%)
  funding_unit: auto
  # Cena na wykresie (symbole Coinalyze; .A = Binance)
  price_symbols: {px_btc: BTCUSDT_PERP.A, px_eth: ETHUSDT_PERP.A}

# ─────────────────────────────────────────────────────────────
#  CVD — KUPNO vs SPRZEDAŻ, SPOT i PERP (poprawka 44; zakładka OI & TOTAL, raport poranny i tygodniowy)
#  Coinalyze: wolumen (v) i wolumen kupujących „po rynku” (bv) z każdej świecy.
#  Delta = kupno − sprzedaż = 2·bv − v, w $; CVD = suma narastająca delty.
#  Rynki: wszystkie pary do USD/USDT/USDC/FDUSD na podanych giełdach, które mają co najmniej
#  min_share wolumenu danego coina (osobno spot i perp, z ostatnich share_days dni; wybór raz dziennie).
#  Koszt: ~90 zapytań na skan + ~150 raz dziennie. Pierwsze uruchomienie pobiera historię (~10 min dłużej).
# ─────────────────────────────────────────────────────────────
cvd:
  enabled: true
  coins: [BTC, ETH, SOL, BNB, XRP, DOGE]
  # giełdy spot (OKX spot nie ma w Coinalyze); perp = te same giełdy co OI (coinalyze.exchanges)
  spot_exchanges: [Binance, Coinbase, Bybit, Kraken, Bitstamp, Bitfinex]
  quotes: [USDT, USD, USDC, FDUSD]
  min_share: 0.01
  share_days: 30
  # historia dzienna od (Coinalyze ma wolumen kupujących od 01.05.2019)
  history_start: "2019-05-01"

# ─────────────────────────────────────────────────────────────
#  ALTY WEDŁUG KAPITALIZACJI (poprawka 46; raport poranny i wieczorny, zakładka OI & TOTAL)
#  CoinGecko: wszystkie coiny z kapitalizacją ≥ $1M (12 zapytań na zapis, darmowy klucz COINGECKO_API_KEY).
#  Koszyki: > $1B, $100M–1B, $10–100M, $1–10M — bez BTC, ETH, stablecoinów, tokenów opakowanych i stakowanych.
#  W każdym koszyku liczy się mediana zmiany ceny („typowy coin”), nie suma kapitalizacji.
#  Koszt: ok. 30 zapytań na dobę (limit darmowego klucza: 10 000 na miesiąc).
#  Narracje: DexScreener (trendujące grupy tokenów), 1 zapytanie na zapis, bez klucza.
# ─────────────────────────────────────────────────────────────
alts:
  enabled: true
  min_volume: 50000              # minimalny obrót 24 h coina ($), żeby liczył się do koszyka
  snapshot_hours_utc: [0, 20]    # pierwszy skan po tych godzinach UTC robi zapis: 0 = zamknięcie dnia (raport poranny),
                                 # 20 = przed raportem wieczornym; więcej godzin = więcej zapytań
  metas: true                    # narracje z DexScreenera

chains:
  # Sieci (poprawka 48): DefiLlama, raz na dobę (workflow „Sieci”, równolegle ze skanem przed raportem porannym).
  # Lista naszych sieci — nazwy dokładnie jak w DefiLlama; coin = cena do porównania w zakładce (opcjonalnie).
  enabled: true
  list:
    - {name: Ethereum, coin: ETH}
    - {name: Robinhood Chain}
    - {name: Solana, coin: SOL}
    - {name: BSC, coin: BNB}
    - {name: TON, coin: TON}
    - {name: Base}
    - {name: Tron, coin: TRX}
    - {name: Hyperliquid L1, coin: HYPE}
  # „Sieć spoza listy rośnie” — progi na próbę (sonda 12.11.2026: DEX p95 ×2,52 / p99 ×7,23; stablecoiny 30D p95 +61% / p99 +409%)
  cand_min: 20000000      # sprawdzamy sieci ze stablecoinami albo TVL ≥ $20M
  dex_ratio: 3.0          # wolumen DEX z 7 dni ÷ średni tydzień z 4 poprzednich
  dex7_min: 10000000      #   … przy wolumenie z 7 dni ≥ $10M
  stable30: 100           # stablecoiny na sieci +100% w 30 dni
  stable_min: 20000000    #   … przy stablecoinach ≥ $20M
  new_days: 35            # nowa sieć: dane od najwyżej 35 dni, a już DEX 7 dni ≥ new_dex7 albo stablecoiny ≥ new_stable
  new_dex7: 10000000
  new_stable: 20000000
  max_rising: 5           # najwyżej tyle sieci w raporcie

tradingview:
  # Serie CRYPTOCAP z TradingView (te same wartości co na wykresach TV).
  symbols:
    total: "CRYPTOCAP:TOTAL"
    total2: "CRYPTOCAP:TOTAL2"
    total3: "CRYPTOCAP:TOTAL3"
    totales: "CRYPTOCAP:TOTALES"     # bez stablecoinów
    total3es: "CRYPTOCAP:TOTAL3ES"   # bez BTC, ETH i stablecoinów
    btc_d: "CRYPTOCAP:BTC.D"
    eth_d: "CRYPTOCAP:ETH.D"
    others: "CRYPTOCAP:OTHERS"       # bez top 10 coinów
    others_d: "CRYPTOCAP:OTHERS.D"   # dominacja OTHERS
    ethbtc: "BINANCE:ETHBTC"         # cena ETH w BTC
    usdt_d: "CRYPTOCAP:USDT.D"
  # tylko świece dzienne (makro USA, poprawka 29; pierwszy raz cała historia)
  daily_symbols:
    dxy: "TVC:DXY"             # indeks dolara
    spx: "SP:SPX"              # S&P 500
    ndx: "NASDAQ:NDX"          # Nasdaq 100
    vix: "TVC:VIX"             # zmienność S&P 500
    us10y: "TVC:US10Y"         # rentowność 10-letnich obligacji USA
    us02y: "TVC:US02Y"         # 2-letnich (do krzywej 10L − 2L)
    gold: "TVC:GOLD"           # złoto
    fed_assets: "FRED:WALCL"   # aktywa Fed (mln USD) ┐
    fed_tga: "FRED:WTREGEN"    # konto Skarbu (mln USD) ├ płynność netto Fed
    fed_rrp: "FRED:RRPONTSYD"  # reverse repo (mld USD) ┘
    fred_m2: "FRED:M2SL"       # M2 (mld USD, miesięcznie)

telegram:
  enabled: true
  # GRUPA: alerty rynkowe i raporty idą do wątku grupy; awarie i sprawy systemu — tylko do Ciebie na priv.
  # Jak ustawić: dodaj bota do grupy, w wybranym wątku napisz /watek@NazwaTwojegoBota,
  # przepisz tu obie liczby i zapisz plik na GitHubie. Puste (null) = wszystko na priv.
  group_chat_id: -1002325353182      # np. -1001234567890
  group_thread_id: 168872    # numer wątku (null = wątek „Ogólny” / grupa bez tematów)
  # Jak często przypominać o awarii (godziny).
  health_reminder_hours: 12

# ─────────────────────────────────────────────────────────────
#  HARMONOGRAM — skany OI/TOTAL i raporty (czas polski, zmiana czasu liczona sama)
#  Pilnuje go Orange Pi (bot.py co minutę): uruchamia skan na GitHubie, a skan przed raportem
#  po zakończeniu (~40 min) od razu buduje raport i wysyła link do grupy.
#  Zmiana godzin = edycja tego pliku na GitHubie (Pi pobiera ją sam w ciągu 5 min).
# ─────────────────────────────────────────────────────────────
schedule:
  timezone: Europe/Warsaw
  scan_every_hours: 2        # zwykłe skany: co 2 h…
  scan_minute: 15            # …o :15 (00:15, 02:15, …)
  reports:
    - scan_at: "06:15"       # raport poranny gotowy ok. 07:00 (dzienne świece zamknięte o 01:00/02:00 PL)
      kind: morning
    - scan_at: "16:05"       # 5 min po zamknięciu sesji w USA, liczone w czasie Nowego Jorku
      timezone: America/New_York   # → zwykle 22:05 PL, ok. 3 tygodnie w roku 21:05 PL; raport ok. 40 min później
      kind: evening
    # raporty tygodniowy i miesięczny — zaraz po zamknięciu świecy (pon. / 1. dzień miesiąca 00:00 UTC = 01:00 PL zimą,
    # 02:00 latem); weekday: 1 = poniedziałek … 7 = niedziela. Gdy 1. dzień miesiąca to poniedziałek — jeden skan, oba raporty.
    - scan_at: "00:05"
      timezone: UTC
      weekday: 1
      kind: weekly
    - scan_at: "00:05"
      timezone: UTC
      monthday: 1
      kind: monthly
    - scan_at: "00:05"       # raport roczny — 1 stycznia, razem z miesięcznym za grudzień (jeden skan, dwa raporty)
      timezone: UTC
      monthday: 1
      month: 1
      kind: yearly
  skip_regular_minutes: 60   # zwykły skan bliżej niż 60 min od skanu przed raportem jest pomijany

# ─────────────────────────────────────────────────────────────
#  RAPORTY — zakładka raporty.html (workflow „Raport”, gałąź reports)
#  notify: powiadomienie na Telegram z linkiem do nowego raportu
#  keep:   ile ostatnich raportów trzymać (starsze są usuwane)
# ─────────────────────────────────────────────────────────────
reports:
  notify: true
  keep: 120
  keep_periodic: 60         # raporty tygodniowe i miesięczne: ile trzymać z każdego rodzaju (osobno od dziennych)
  page_url: https://cryptoloser8-coder.github.io/scanner/raporty.html
  # ── układ raportu (poprawka 19); brak wpisu = wartość domyślna z report.py ──
  range_years: 2            # paski zakresu (Rynek, funding): min–maks. z ostatnich N lat
  ema_near_pct: 3           # EMA200: tylko coiny bliżej niż X% od średniej…
  ema_min_volume: 10000000  # …z obrotem co najmniej $ dziennie
  weekly_ema_coins: [BTC, ETH, SOL, BNB]   # raport tygodniowy: tabela EMA200 na świecy tygodniowej (zamknięcie tygodnia)
  ema_max_rows: 15
  oi_flat_pct: 1            # OI i cena: zmiana poniżej X% = „bez zmian”
  liq_days: 7               # likwidacje: ostatnie N pełnych dni
  liq_big_pct: 90           # linia „duży dzień” = percentyl dziennych likwidacji z 2 lat
  alts_ref_level: 1.0       # tabela altów: kolumny = szczyty OI OTHERS/OI BTC powyżej tego poziomu…
  alts_ref_count: 3         # …ostatnie N (+ najniższy punkt z 12 miesięcy)
  alts_chart_from: "2020-01-01"
  econ:                     # dane makro z USA (kalendarz ekonomiczny TradingView)
    enabled: true
    countries: [US]
    min_importance: medium  # medium = ★★ i ★★★, high = tylko ★★★
    days_back: 5            # ile dni wstecz szukać ostatniego dnia z publikacjami (poniedziałek rano → piątek)
    days_ahead: 5           # ile dni naprzód szukać najbliższego dnia z zaplanowanymi publikacjami
  lines:                    # linie poziomów na wykresach: [poziom, opis]
    oi_others_vs_btc:
      - [0.60, "strefa dołków"]
      - [0.85, "górne 10% dni"]
      - [0.95, "szczyty 03.2024 i 07.2025"]
      - [1.00, "zrównanie z BTC"]
    alts_vs_btc:
      - [0.28, "dołki 2025–2026"]
      - [0.38, "szczyt 09.2025"]
      - [0.47, "szczyty 12.2023 i 12.2024"]

# ─────────────────────────────────────────────────────────────
#  POZIOMY — alerty o zbliżaniu się i przebiciu
#
#  series:   id serii (lista id: w zakładce, najedź na nazwę serii)
#            np. total, total2, total3, btc_d, oi_btc, oi_alts, oi_others, lev_others
#  level:    poziom; dla kapitalizacji/OI w USD (można pisać 1.2e12 albo 1200000000000)
#            dla dominacji/dźwigni w procentach (np. 58.5)
#  near_pct: alert, gdy wartość jest bliżej niż X% od poziomu
#  label:    Twój opis, pojawi się w alercie i na wykresie
#
#  direction: up = tylko przebicie w górę (i zbliżanie od dołu), down = odwrotnie; brak = obie strony
#
#  Bot wysyła alert raz przy wejściu w strefę i raz przy przebiciu poziomu.
#  Ponowny alert dopiero po wyjściu ze strefy (1.5 × near_pct).
# ─────────────────────────────────────────────────────────────
levels:
  # Lewar altów (poprawka 63, badanie mini altsezonów 13.11.2026 — claude/mini-altsezony.md): od 09.2022 po każdym
  # przebiciu 0,95 w górę mediana altów była niżej po 30 dniach (6 z 6; −18…−42%), po przebiciu 1,0 — 4 z 4.
  - series: oi_others_vs_btc
    level: 0.95
    near_pct: 3
    direction: up
    label: "historycznie koniec fali altów"
  - series: oi_others_vs_btc
    level: 1.0
    near_pct: 0
    direction: up
    label: "historycznie szczyt fali altów"
#  - series: total3
#    level: 1.0e12
#    near_pct: 3
#    label: "TOTAL3 — opór 1T"
#  - series: btc_d
#    level: 60
#    near_pct: 1
#    label: "BTC.D 60%"

# ─────────────────────────────────────────────────────────────
#  ZMIANY — alert, gdy seria zmieni się o X% w zadanym oknie
#  (np. gwałtowny wzrost OI altów). Cooldown chroni przed spamem.
# ─────────────────────────────────────────────────────────────
changes: []
#  - series: oi_others
#    window_hours: 24
#    pct: 10
#    cooldown_hours: 12

# ─────────────────────────────────────────────────────────────
#  EMA200 (zakładka ema.html) — działa na Orange Pi, dane z Binance spot
#  Pi czyta ten plik przy każdym uruchomieniu (co 5 min), więc zmiana
#  alertów działa po commicie, bez wgrywania czegokolwiek na Pi.
# ─────────────────────────────────────────────────────────────
ema:
  period: 200            # długość EMA (świeca dzienna)
  quote: USDT            # liczymy wszystkie pary */USDT (bez stablecoinów, fiat, złota i tokenów z dźwignią)
  min_days: 300          # coin musi mieć tyle zamkniętych dni, inaczej EMA jest za mało dokładna (pomijany)
  min_volume_usd: 0      # pomiń pary z mniejszym obrotem 24h (0 = wszystkie)
  exclude: []            # dodatkowe coiny do pominięcia, np. [LUNC, USTC]
  cross_buffer_pct: 0.5  # przecięcie liczy się dopiero po wyjściu o tyle % na drugą stronę (chroni przed „piłą”)
  cooldown_hours: 12     # po alercie o przecięciu ten sam coin milczy tyle godzin
  near_cooldown_hours: 24  # alert „zbliża się” dla tego samego coina najwyżej raz na tyle godzin
  publish_minutes: 15    # jak często Pi odświeża dane na stronie
  weekly_min_weeks: 300  # EMA200 na świecy tygodniowej: tylko coiny z co najmniej tyloma zamkniętymi tygodniami (~5,7 roku)
  weekly_alerts: [BTC, ETH, SOL, XRP, BNB, DOGE]   # alert, gdy zamknięcie tygodnia (niedziela 24:00 UTC) przetnie EMA200 1W
  #
  # ALERTY — dowolnie wiele reguł:
  #   coins:     lista coinów albo all (uwaga: all = setki coinów, dużo wiadomości)
  #   cross:     true = alert przy przecięciu EMA
  #   confirm:   live  = w trakcie dnia (sprawdzane co 5 min, z buforem cross_buffer_pct)
  #              close = dopiero po zamknięciu świecy dziennej (00:00 UTC), najmniej fałszywych sygnałów
  #   direction: both | up (tylko przebicie w górę) | down (tylko w dół)
  #   near_pct:  alert, gdy cena jest bliżej niż X% od EMA (raz; ponownie po oddaleniu na 1,5 × X)
  alerts:
    - coins: [BTC, ETH, SOL, XRP, BNB, DOGE, SUI]   # HYPE nie ma pary na Binance spot → brak EMA200
      cross: true
      confirm: live
      direction: both
      near_pct: 2
#    - coins: all
#      cross: true
#      confirm: close

# ─────────────────────────────────────────────────────────────
#  FIBO — Twoje własne setupy (zakładka fib.html, liczy Orange Pi co 5 min)
#  Strefa 0.705–0.786 z linią 0.75. Alerty: zbliża się (near_pct), wejście w strefę,
#  przebicie 0.786, unieważnienie (cena za dołkiem/szczytem ruchu).
#  Setupy dodajesz tutaj albo z Telegrama (tylko administrator):
#    /fib COIN SZCZYT DOŁEK [long|short] [opis]   np. /fib SOL 250 120 long term
#    /fiby  (lista, każdy)    /usun ID    /pomoc (wszystkie komendy)
#  long  = cofnięcie po wzroście (strefa pod szczytem), short = odbicie po spadku.
#  Ceny: Binance */USDT, a gdy coina tam nie ma — Hyperliquid (np. HYPE).
# ─────────────────────────────────────────────────────────────
fib:
  near_pct: 2            # alert „zbliża się”, gdy cena jest bliżej niż 2% od strefy
  # Propozycje (automat, tylko na stronie): główny ruch w oknach 30/90/365 dni
  proposals:
    windows: [30, 90, 365]
    min_move_pct: 8      # ruch co najmniej 8%…
    vol_mult: 4          # …i co najmniej 4× typowy dzienny zakres coina (BTC i memecoiny traktowane uczciwie)
    near_pct: 5          # pokazuj, gdy cena jest w strefie albo bliżej niż 5% od niej
    max: 60
  setups: []
#    - coin: SOL
#      high: 250
#      low: 120
#      dir: long
#      label: "SOL 1D long term"

# ─────────────────────────────────────────────────────────────
#  LIKWIDACJE — alert, gdy suma likwidacji w oknie przekroczy próg (USD)
#
#  series: liq_total, liq_btc, liq_eth, liq_others (long + short razem),
#          albo osobno np. liq_btc_long / liq_others_short,
#          coin z watchlisty: liq_sol, giełda: liq_ex_hyperliquid
#  Progi fundingu ustawiasz jak zwykłe poziomy (sekcja levels),
#  np. series: fund_others, level: 40, near_pct: 10   (% rocznie)
# ─────────────────────────────────────────────────────────────
liq_alerts: []
#  - series: liq_total
#    window_hours: 4
#    usd: 1.0e9
#    cooldown_hours: 12
#    label: "Kaskada likwidacji"
#  - series: liq_others_long
#    window_hours: 24
#    usd: 5.0e8
#    cooldown_hours: 24

# ─────────────────────────────────────────────────────────────
#  ARCHIWUM — kopie danych na wypadek awarii (poprawka 27)
#  Orange Pi raz na dobę pakuje gałęzie data, ema, reports + stan Pi (~/.ema-monitor)
#  do ~/scanner-archive/scanner-RRRR-MM-DD.tar.xz (collector/backup.py, uruchamia ema_cron.sh).
#  Dodatkowo GitHub co tydzień zapisuje to samo jako wydanie „archiwum-RRRR-MM-DD” (workflow Archiwum).
# ─────────────────────────────────────────────────────────────
backup:
  dir: ~/scanner-archive
  keep_daily: 14       # ostatnie 14 dni + na zawsze plik z 1. dnia każdego miesiąca
  hour_utc: 2          # kopia po 02:00 UTC (03:00/04:00 PL)

# ─────────────────────────────────────────────────────────────
#  DŁUŻSZA HISTORIA istniejących serii (poprawka 28, collector/history.py)
#  Każdy skan dobiera tylko braki; pierwsze pobranie z archiwum Binance ~4000 małych plików (~15 min, raz).
#  - px_btc / px_eth przed 03.2020: dzienny indeks TradingView,
#  - fund_btc / fund_eth przed 22.09.2022: funding z Coinalyze (od 2020) z wagami stałymi
#    (udziały giełd w OI z pierwszych `funding_weight_days` dni danych OI),
#  - oi_btc_binance / oi_eth_binance: OI perpetuali USDT-M na Binance z data.binance.vision (od 09.2020 / 12.2021).
# ─────────────────────────────────────────────────────────────
history:
  enabled: true
  price_symbols:
    px_btc: "INDEX:BTCUSD"
    px_eth: "INDEX:ETHUSD"
  funding_groups: [btc, eth]
  funding_weight_days: 30
  vision_oi:
    oi_btc_binance: BTCUSDT
    oi_eth_binance: ETHUSDT
  vision_max_minutes: 25     # limit czasu na archiwum w jednym skanie (resztę dobierze następny)
  # świece 1h BTC/ETH od 08.2017 z archiwum Binance spot → osobne pliki px_1h_btc.json / px_1h_eth.json (poprawka 56)
  spot_1h:
    px_btc: BTCUSDT
    px_eth: ETHUSDT
  spot_1h_start: "2017-08-01"

# ─────────────────────────────────────────────────────────────
#  CYKL BTC i MAKRO (poprawka 29, collector/cycle.py) — serie do nakładania w zakładce OI & TOTAL
#  MVRV z Coin Metrics Community (bez klucza), Mayer / 200W / Pi Cycle z ceny BTC, SSR z TradingView,
#  płynność netto Fed i M2 z FRED (przez TradingView). Linie poziomów: wartości przy poprzednich
#  szczytach i dnach (cykl = okres między halvingami), liczone z danych.
# ─────────────────────────────────────────────────────────────
cycle:
  enabled: true
  coinmetrics: true
  ref_tops: 3          # linie dla tylu ostatnich szczytów…
  ref_bottoms: 3       # …i den
  # dno bieżącego cyklu uznane przez nas (decyzja 01.11.2026) — reguła potwierdziłaby je dopiero po halvingu 2028;
  # od tego dnia raporty liczą akumulację. Gdy cena zamknie się poniżej tego dna, wpis przestaje działać (wraca bessa).
  bottoms: ["2026-06-30"]
  next_halving_estimate: "2028-04-15"   # szacunek daty halvingu — okno szczytu w raporcie miesięcznym; bot przypomina
                                        # przed tą datą (30, 7, 1 dzień), co zrobić po halvingu
  # halvingi po 2024 (dzień UTC z eksploratora bloków) — dopisz po halvingu, potem /raport_teraz halving;
  # 2012, 2016, 2020 i 2024 są w kodzie (cycle.py)
  halvings: []

# ─────────────────────────────────────────────────────────────
#  HISTORYCZNE WYDARZENIA (poprawka 63) — pionowe linie na wykresach (przycisk „Historyczne wydarzenia”
#  w oi.html, liq.html i ema.html) i znaczniki na wykresach BTC od 2011 w raportach tygodniowym i miesięcznym.
#  date:  dzień UTC (RRRR-MM-DD)
