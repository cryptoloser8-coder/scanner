# ─────────────────────────────────────────────────────────────
#  OI & TOTAL Monitor — konfiguracja
#  Po zmianie tego pliku (commit na main) kolejne uruchomienie
#  bota użyje nowych ustawień — nic więcej nie trzeba robić.
# ─────────────────────────────────────────────────────────────

coinalyze:
  # Giełdy, z których sumujemy open interest (perpetuale).
  # Nazwy porównywane z listą /exchanges w Coinalyze (bez rozróżniania wielkości liter).
  # (Bitget nie ma w Coinalyze. BitMEX jest, ale na razie nie trafia do listy rynków — do sprawdzenia.)
  exchanges: [Binance, Bybit, OKX, Hyperliquid, Deribit, BitMEX]
  # Ile największych (wg OI) coinów liczymy. 0 = wszystkie.
  # Ogon poza top 200 to zwykle ~1–2% całego OI, a mocno skraca czas pobierania
  # (limit API: 40 zapytań/min, każdy rynek = 1 zapytanie).
  max_assets: 200
  # Co ile godzin odświeżać listę rynków i ranking top coinów
  # (odświeżenie sprawdza OI wszystkich rynków — to najdłuższy krok, ~1h).
  universe_refresh_hours: 72
  # Od kiedy pobierać historię dzienną przy backfillu
  # (Coinalyze ma pełne dane mniej więcej od 09.2022 — wcześniejsze dni są obcinane).
  daily_history_start: "2019-01-01"

  # Tylko krypto: giełdy listują też perpy na złoto, ropę, akcje (XAU, CL, GOOGL…).
  # Liczymy tylko coiny z top N wg kapitalizacji na CoinGecko…
  crypto_whitelist_top: 1500
  # …i zawsze wykluczamy te (tokeny złota, indeksy, akcje, które mogłyby trafić na listę):
  exclude_assets: [XAU, XAG, XPT, XPD, XAUT, PAXG, KAU, KAG, CL, BZ, NG, WTI, BRENT, COPPER,
                   SPX, SPY, QQQ, NDX, NAS100, US30, US500, DJI, SOXL, TQQQ, SPCX,
                   AAPL, MSFT, GOOGL, GOOG, AMZN, META, TSLA, NVDA, AMD, INTC, NFLX, COIN,
                   MSTR, HOOD, PLTR, SNDK, SKHYNIX, SKHY, ORCL, AVGO, MU, TSM, BABA, CRCL,
                   EUR, JPY, GBP, USDC, USDT, FDUSD, USDE, EURC,
                   # perpy pre-IPO na prywatne spółki
                   ANTHROPIC, OPENAI, SPACEX, XAI, STRIPE, DATABRICKS, ANDURIL]
  # Wymuś uwzględnienie coina, którego nie ma na liście CoinGecko (np. świeży listing).
  include_assets: []

# Coiny, których OI ma być dostępne osobno na wykresach (oprócz BTC i ETH).
# Te same coiny mają osobne likwidacje i funding w zakładce Likwidacje.
watchlist: [SOL, XRP, BNB, DOGE, HYPE, SUI]

# ─────────────────────────────────────────────────────────────
#  LIKWIDACJE I FUNDING (zakładka liq.html)
#  Te same giełdy co OI. Likwidacje Coinalyze ma tylko z Binance, Bybit i OKX
#  (Hyperliquid i Deribit: brak), funding — ze wszystkich, także z Hyperliquid.
#  Każdy rynek = 1 zapytanie
#  na likwidacje + 1 na funding, więc liczymy tylko największe coiny.
#  Pierwsze uruchomienie po wgraniu samo pobierze historię (dłuższe o ~40 min).
# ─────────────────────────────────────────────────────────────
liquidations:
  enabled: true
  # BTC + ETH + tyle największych (wg OI) altów; watchlista jest dodawana zawsze.
  top_alts: 30
  # Pomijaj rynki z OI poniżej tej kwoty (USD) — prawie nie mają likwidacji, a kosztują zapytanie.
  min_market_oi_usd: 1.0e6
  # Co ile godzin giełda rozlicza funding (do przeliczenia na % rocznie). Hyperliquid co godzinę.
  funding_interval_hours: {default: 8, Hyperliquid: 1}
  # Jednostka fundingu w Coinalyze: auto | percent (0.01 = 0,01%) | fraction (0.0001 = 0,01%)
  funding_unit: auto
  # Cena na wykresie (symbole Coinalyze; .A = Binance)
  price_symbols: {px_btc: BTCUSDT_PERP.A, px_eth: ETHUSDT_PERP.A}

tradingview:
  # Serie CRYPTOCAP z TradingView (te same wartości co na wykresach TV).
  symbols:
    total: "CRYPTOCAP:TOTAL"
    total2: "CRYPTOCAP:TOTAL2"
    total3: "CRYPTOCAP:TOTAL3"
    totales: "CRYPTOCAP:TOTALES"     # bez stablecoinów
    total3es: "CRYPTOCAP:TOTAL3ES"   # bez BTC, ETH i stablecoinów
    btc_d: "CRYPTOCAP:BTC.D"
    eth_d: "CRYPTOCAP:ETH.D"
    usdt_d: "CRYPTOCAP:USDT.D"

telegram:
  enabled: true
  # Codzienne podsumowanie — pierwsze uruchomienie po tej godzinie (UTC).
  daily_report_hour_utc: 7
  # Jak często przypominać o awarii źródła danych (godziny).
  health_reminder_hours: 12
  # Dopisz do raportu dziennego likwidacje z 24h i funding (true/false).
  report_liquidations: false

# ─────────────────────────────────────────────────────────────
#  POZIOMY — alerty o zbliżaniu się i przebiciu
#
#  series:   id serii (lista id: w zakładce, najedź na nazwę serii)
#            np. total, total2, total3, btc_d, oi_btc, oi_alts, oi_others, lev_others
#  level:    poziom; dla kapitalizacji/OI w USD (można pisać 1.2e12 albo 1200000000000)
#            dla dominacji/dźwigni w procentach (np. 58.5)
#  near_pct: alert, gdy wartość jest bliżej niż X% od poziomu
#  label:    Twój opis, pojawi się w alercie i na wykresie
#
#  Bot wysyła alert raz przy wejściu w strefę i raz przy przebiciu poziomu.
#  Ponowny alert dopiero po wyjściu ze strefy (1.5 × near_pct).
# ─────────────────────────────────────────────────────────────
levels: []
#  - series: total3
#    level: 1.0e12
#    near_pct: 3
#    label: "TOTAL3 — opór 1T"
#  - series: btc_d
#    level: 60
#    near_pct: 1
#    label: "BTC.D 60%"

# ─────────────────────────────────────────────────────────────
#  ZMIANY — alert, gdy seria zmieni się o X% w zadanym oknie
#  (np. gwałtowny wzrost OI altów). Cooldown chroni przed spamem.
# ─────────────────────────────────────────────────────────────
changes: []
#  - series: oi_others
#    window_hours: 24
#    pct: 10
#    cooldown_hours: 12

# ─────────────────────────────────────────────────────────────
#  LIKWIDACJE — alert, gdy suma likwidacji w oknie przekroczy próg (USD)
#
#  series: liq_total, liq_btc, liq_eth, liq_others (long + short razem),
#          albo osobno np. liq_btc_long / liq_others_short,
#          coin z watchlisty: liq_sol, giełda: liq_ex_hyperliquid
#  Progi fundingu ustawiasz jak zwykłe poziomy (sekcja levels),
#  np. series: fund_others, level: 40, near_pct: 10   (% rocznie)
# ─────────────────────────────────────────────────────────────
liq_alerts: []
#  - series: liq_total
#    window_hours: 4
#    usd: 1.0e9
#    cooldown_hours: 12
#    label: "Kaskada likwidacji"
#  - series: liq_others_long
#    window_hours: 24
#    usd: 5.0e8
#    cooldown_hours: 24
