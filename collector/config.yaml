#  desc:  opis po najechaniu / kliknięciu
#  kind:  krach | upadek | hack | prawo | etf | polityka | inne  (kolor linii)
#  Nowy wpis widać po najbliższym skanie (meta.json), w raportach od następnego raportu.
# ─────────────────────────────────────────────────────────────
