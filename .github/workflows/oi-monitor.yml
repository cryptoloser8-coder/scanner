name: OI Monitor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "run = zwykłe uruchomienie, backfill = pobranie pełnej historii"
        type: choice
        options: [run, backfill]
        default: run
      report:
        description: "Po skanie zbuduj raport (none = bez raportu). Uruchamia to Orange Pi wg harmonogramu."
        type: choice
        options: [none, morning, evening, manual, test]
        default: none

permissions:
  contents: write

concurrency:
  group: oi-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'backfill' && 330 || 150 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Pobierz dotychczasowe dane (gałąź data)
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        # błąd pobrania = błąd kroku (dawniej pusty katalog → force-push nadpisywał historię)
        run: bash collector/fetch_branch.sh data data-branch "$REMOTE"

      - name: Zbierz dane i wyślij alerty
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/oi.html
        run: python collector/main.py ${{ inputs.mode || 'run' }} --data-dir data-branch

      - name: Opublikuj dane
        if: always() && hashFiles('data-branch/meta.json') != ''
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          # bezpiecznik (collector/guard.py) blokuje publikację, która traci historię;
          # backfill celowo przelicza historię → bez blokady
          PUBLISH_ALLOW_SHRINK: ${{ inputs.mode == 'backfill' && '1' || '0' }}
        run: bash collector/publish.sh data-branch "$REMOTE"

  # raport zaraz po świeżych danych (harmonogram w config.yaml → schedule, uruchamia Orange Pi)
  report:
    needs: collect
    if: ${{ always() && inputs.mode != 'backfill' && inputs.report != '' && inputs.report != 'none' }}
    uses: ./.github/workflows/report.yml
    with:
      kind: ${{ inputs.report }}
    secrets: inherit
