name: Dźwignia — pozycje

# Pozycje i zlecenia portfeli z sita + próbki tracących (collector/hl_wallets.py positions) → sumy longów
# i shortów grup na coinach (historia co ~2 h), kafelki, największe zmiany, stan portfeli do okna na stronie.
# Uruchamia się sam po każdym skanie „OI Monitor” (co ~2 h); ręcznie: Actions → Dźwignia — pozycje → Run workflow.
# Wynik: gałąź hl (hl_groups.json, hl_now.json, hl_wallets.json, hl_meta.json). Darmowe API Hyperliquid.

on:
  workflow_run:
    workflows: ["OI Monitor"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hl-positions
  cancel-in-progress: false

jobs:
  positions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Pobierz dane (gałęzie hl i hl-sito)
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          bash collector/fetch_branch.sh hl hl-branch "$REMOTE"
          bash collector/fetch_branch.sh hl-sito hl-sito "$REMOTE"

      - name: Pozycje portfeli
        run: python collector/hl_wallets.py positions --data-dir hl-branch --sito-dir hl-sito

      - name: Opublikuj (gałąź hl)
        if: always() && hashFiles('hl-branch/hl_meta.json') != ''
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          DATA_BRANCH: hl
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_AUTHOR_NAME: hl-bot
          GIT_AUTHOR_EMAIL: hl-bot@users.noreply.github.com
        run: bash collector/publish.sh hl-branch "$REMOTE"
