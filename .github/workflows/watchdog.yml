name: Watchdog

# Niezależny strażnik: sprawdza co ~3 h, czy Orange Pi publikuje dane EMA/Fibo
# i czy skany OI są świeże. Gdy nie — pisze do administratora na priv.
# (Gdy Pi jest wyłączone, nikt inny tego nie zauważy: Pi uruchamia też skany OI.)
# Harmonogram GitHuba bywa opóźniony — tu to nie przeszkadza.

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - name: Sprawdź świeżość danych
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collector/watchdog.py --repo "${{ github.repository }}"
