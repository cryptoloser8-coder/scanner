name: Raport

# Buduje raport z gałęzi data (OI, TOTAL, likwidacje) i ema (EMA200, Fibo),
# publikuje go na gałęzi reports (czyta ją zakładka raporty.html)
# i wysyła na Telegram powiadomienie z linkiem (do wątku grupy, jeśli ustawiony).
# Uruchamianie:
#   - automatycznie: OI Monitor po skanie (harmonogram w config.yaml → schedule, wyzwala Orange Pi),
#   - z Telegrama: /raport_teraz (także /raport_teraz tydzień | miesiąc),
# Rodzaje weekly / monthly = raport tygodniowy / miesięczny za ostatni pełny okres (kilka naraz: "weekly,monthly").
#   - ręcznie: Actions → Raport → Run workflow.
# Usuwanie raportu z historii: pole „delete” (ID z adresu raportu) albo /usun_raport ID na Telegramie.
# Raport specjalny (jednorazowa analiza, collector/adhoc/<nazwa>.py): pole „special” = nazwa
# (np. btc_ema200) albo /raport_specjalny NAZWA na Telegramie; pole „kind” jest wtedy pomijane.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Rodzaj raportu"
        type: choice
        options: [manual, weekly, monthly, "weekly,monthly", yearly, "monthly,yearly", "weekly,monthly,yearly", halving, morning, evening, test]
        default: manual
      delete:
        description: "Usuń raport(y) z historii zamiast budować nowy: ID z adresu raportu (?id=…), kilka po przecinku"
        type: string
        default: ""
      special:
        description: "Raport specjalny: nazwa pliku z collector/adhoc/ bez .py (np. btc_ema200); puste = zwykły raport"
        type: string
        default: ""
  workflow_call:
    inputs:
      kind:
        type: string
        default: manual
      delete:
        type: string
        default: ""
      special:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: report
      cancel-in-progress: false
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Pobierz dane (gałęzie data, ema, chains, reports)
        run: |
          bash collector/fetch_branch.sh data    data-branch    "$REMOTE"
          bash collector/fetch_branch.sh ema     ema-branch     "$REMOTE" || mkdir -p ema-branch
          bash collector/fetch_branch.sh chains  chains-branch  "$REMOTE" || mkdir -p chains-branch
          # reports: błąd pobrania = błąd kroku (dawniej pusty katalog → nadpisanie wszystkich raportów)
          bash collector/fetch_branch.sh reports reports-branch "$REMOTE"
          rm -rf reports-branch/.git

      - name: Zbuduj raport
        if: inputs.delete == ''
        env:
          KIND: ${{ inputs.kind || 'manual' }}
          SPECIAL: ${{ inputs.special }}
        run: |
          if [ -n "$SPECIAL" ]; then KIND="adhoc:$SPECIAL"; fi
          python collector/report.py make --kind "$KIND" --data data-branch --ema ema-branch --chains chains-branch --out reports-branch

      - name: Usuń raport(y) z historii
        if: inputs.delete != ''
        env:
          IDS: ${{ inputs.delete }}
        run: python collector/report.py delete --id "$IDS" --out reports-branch

      - name: Opublikuj raport (gałąź reports)
        env:
          DATA_BRANCH: reports
          PUBLISH_ALLOW_SHRINK: ${{ inputs.delete != '' && '1' || '0' }}   # usunięcie = mniej plików (celowo)
          GIT_AUTHOR_NAME: report-bot
          GIT_AUTHOR_EMAIL: report-bot@users.noreply.github.com
        run: bash collector/publish.sh reports-branch "$REMOTE"

      - name: Powiadomienie na Telegram
        if: inputs.delete == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collector/report.py notify --out reports-branch
