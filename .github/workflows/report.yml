name: Raport

# Buduje raport z gałęzi data (OI, TOTAL, likwidacje) i ema (EMA200, Fibo),
# publikuje go na gałęzi reports (czyta ją zakładka raporty.html)
# i wysyła na Telegram powiadomienie z linkiem.
# Uruchamianie: Actions → Raport → Run workflow (później także z Orange Pi).

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Rodzaj raportu"
        type: choice
        options: [test, daily, manual]
        default: test

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Pobierz dane (gałęzie data, ema, reports)
        run: |
          git clone -q --depth 1 --branch data    "$REMOTE" data-branch
          git clone -q --depth 1 --branch ema     "$REMOTE" ema-branch    || mkdir -p ema-branch
          git clone -q --depth 1 --branch reports "$REMOTE" reports-branch 2>/dev/null || mkdir -p reports-branch
          rm -rf reports-branch/.git

      - name: Zbuduj raport
        run: python collector/report.py make --kind "${{ inputs.kind || 'test' }}" --data data-branch --ema ema-branch --out reports-branch

      - name: Opublikuj raport (gałąź reports)
        env:
          DATA_BRANCH: reports
          GIT_AUTHOR_NAME: report-bot
          GIT_AUTHOR_EMAIL: report-bot@users.noreply.github.com
        run: bash collector/publish.sh reports-branch "$REMOTE"

      - name: Powiadomienie na Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/raporty.html
        run: python collector/report.py notify --out reports-branch
